<!DOCTYPE html>
<html lang="tr">
<head>
    <title>edamm</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <style>
        body { margin: 0; overflow: hidden; background-color: #FFC0CB; touch-action: none; }

        /* Fotoğrafın görüneceği alan (Başlangıçta gizli) */
        #final-photo-container {
            display: none; /* Gizli */
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            text-align: center;
            animation: popIn 1s ease-out;
        }

        /* Fotoğraf ayarları */
        #final-photo-container img {
            max-width: 300px; /* Genişlik sınırı */
            max-height: 300px;
            border: 5px solid white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            80% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* --- YENİ KONTROL BUTONLARI --- */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none; /* Boşluklara tıklamayı engelleme */
            z-index: 500;
        }

        .control-btn {
            pointer-events: auto; /* Butonlara tıklanabilsin */
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid white;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #btn-jump {
            background-color: rgba(255, 100, 100, 0.7); /* Kırmızımsı */
        }
        
        #btn-right {
            background-color: rgba(100, 200, 100, 0.7); /* Yeşilimsi */
        }

        .control-btn:active {
            transform: scale(0.95);
            opacity: 1;
        }

    </style>
</head>
<body>

<!-- SONUÇ FOTOĞRAFI ALANI -->
<!-- GitHub'a yüklerken fotoğrafının adını 'bizim_foto.jpg' yapmalısın! -->
<div id="final-photo-container">
    <img src="bizim_foto.jpg" alt="Bizim Fotoğrafımız">
</div>

<!-- KONTROL BUTONLARI -->
<div id="controls">
    <div id="btn-jump" class="control-btn">ZIPLA</div>
    <div id="btn-right" class="control-btn">İLERİ</div>
</div>

<!-- Kaboom v3000 -->
<script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>

<script>
    // 1. OYUNU BAŞLAT (Hemen çalışır)
    kaboom({
        background: [255, 192, 203], // Pembe Arkaplan
        width: window.innerWidth,
        height: window.innerHeight,
        font: "Arial", 
    });

    // 2. SAHNE
    scene("game", () => {
        
        setGravity(2000); 

        const groundHeight = 80;
        const groundY = height() - groundHeight; 

        // --- DEKORASYON: HAREKETLİ BULUTLAR ---
        loop(2, () => {
            const cloudY = rand(50, height() / 2);
            const cloudScale = rand(0.5, 1.5);
            add([
                circle(30),
                pos(width(), cloudY),
                color(255, 255, 255),
                opacity(0.6),
                move(LEFT, rand(20, 50)), 
                scale(cloudScale),
                lifespan(30), 
                "cloud"
            ]);
        });

        // --- DEKORASYON: AĞAÇLAR (DAHA DÜZ VE SADE) ---
        const mapWidth = 5000;
        for(let i=200; i < mapWidth; i += rand(300, 600)) {
            // Ağaç Gövdesi
            add([
                rect(20, 100), 
                pos(i, groundY), 
                color(100, 70, 50), 
                anchor("bot")
            ]);
            // Ağaç Yaprakları (Tek parça, düz daire)
            add([
                circle(45), 
                pos(i, groundY - 100), 
                color(34, 139, 34), 
                anchor("center")
            ]); 
        }

        // Çiçekler (Sadeleştirildi)
        for(let i=50; i < mapWidth; i += rand(60, 150)) {
            add([circle(5), pos(i, groundY - 10), color(rand(200, 255), rand(100, 200), rand(150, 255)), anchor("center")]);
            add([rect(2, 10), pos(i, groundY), color(0, 100, 0), anchor("bot")]);
        }

        // --- ZEMİN ---
        add([
            rect(mapWidth + 1000, groundHeight), 
            pos(0, groundY),
            area(),
            body({ isStatic: true }),
            color(60, 179, 113), 
            anchor("topleft"),
            "ground"
        ]);

        // --- ENGELLER (KIRIK KALP ŞEKLİ) ---
        const obstaclePositions = [900, 1600, 2300, 3000, 3700];

        for (let x of obstaclePositions) {
            add([
                rect(30, 30), 
                pos(x, groundY), 
                area({ scale: 0.8 }), 
                anchor("bot"), 
                opacity(0), 
                "obstacle",
                {
                    draw() {
                        const c = rgb(255, 0, 0); 
                        const center = vec2(0, -25); 

                        drawRect({
                            width: 30, height: 30,
                            pos: center,
                            color: c,
                            angle: 45,
                            anchor: "center"
                        });
                        drawCircle({
                            pos: center.sub(vec2(10, 10)),
                            radius: 15,
                            color: c
                        });
                        drawCircle({
                            pos: center.add(vec2(10, -10)),
                            radius: 15,
                            color: c
                        });
                        
                        const lineC = rgb(0,0,0);
                        drawLine({ p1: center.sub(vec2(0, 20)), p2: center.sub(vec2(5, 5)), width: 3, color: lineC });
                        drawLine({ p1: center.sub(vec2(5, 5)), p2: center.add(vec2(5, 5)), width: 3, color: lineC });
                        drawLine({ p1: center.add(vec2(5, 5)), p2: center.add(vec2(0, 20)), width: 3, color: lineC });
                    }
                }
            ]);
        }

        // --- OYUNCU (KIZ) ---
        const player = add([
            rect(30, 50), 
            pos(100, groundY),
            area(),
            body(),
            color(0, 0, 0),
            opacity(0), 
            anchor("bot"), 
            "player"
        ]);

        // Kız Çizimi
        player.add([circle(20), pos(0, -55), color(0, 0, 0), anchor("center")]); // Saç (Arka)
        player.add([rect(26, 30), pos(0, -30), color(101, 67, 33), anchor("center")]); // Elbise
        player.add([rect(34, 25), pos(0, -10), color(0, 0, 0), anchor("center")]); // Etek
        player.add([circle(14), pos(0, -55), color(255, 224, 189), anchor("center")]); // Kafa
        player.add([circle(2), pos(-7, -52), color(255, 182, 193), anchor("center")]); // Yanak
        player.add([circle(2), pos(7, -52), color(255, 182, 193), anchor("center")]); // Yanak
        player.add([rect(28, 8), pos(0, -66), color(0, 0, 0), anchor("center")]); // Kahkül

        // --- ERKEK KARAKTER (GÜNCELLENDİ: SİYAH KIYAFET) ---
        const boyX = 4200;
        const boyfriend = add([
            rect(30, 60),
            pos(boyX, groundY), 
            area(),
            body({ isStatic: true }),
            color(0,0,0),
            opacity(0),
            anchor("bot"), 
            "boyfriend"
        ]);

        // Erkek Çizimi
        boyfriend.add([rect(26, 45), pos(0, -25), color(0, 0, 0), anchor("center")]); // Vücut (SİYAH YAPILDI)
        boyfriend.add([circle(15), pos(0, -60), color(255, 224, 189), anchor("center")]); // Kafa
        boyfriend.add([circle(16), pos(0, -64), color(50, 50, 50), anchor("center")]); // Saç
        boyfriend.add([circle(15), pos(0, -60), color(255, 224, 189), anchor("center")]); // Maske
        
        // --- GÖRÜNMEZ DUVAR (ARKASINA GEÇİLMESİN DİYE) ---
        add([
            rect(10, height()), // Ekran kadar uzun
            pos(boyX + 10, 0), // Erkeğin biraz arkasında
            area(),
            body({ isStatic: true }),
            opacity(0), // Görünmez
            "wall"
        ]);


        // --- OYNANIŞ ---
        let isGameFinished = false;
        let isRightBtnPressed = false; // Sağ butona basılıyor mu?

        player.onUpdate(() => {
            if(!isGameFinished) {
                const currCam = camPos();
                const targetX = player.pos.x + 150;
                camPos(lerp(currCam.x, targetX, 0.08), height() / 2);
            }
            
            // HAREKET MANTIĞI: Buton basılıysa VEYA klavye sağ tuşu basılıysa
            if ((isRightBtnPressed || isKeyDown("right")) && !isGameFinished) {
                player.move(350, 0);

                // Yürürken efekt
                if (time() % 0.2 < 0.1) {
                     add([
                        rect(4, 4),
                        pos(player.pos.x - 10, player.pos.y - 10),
                        color(255, 100, 100),
                        move(LEFT, 50),
                        lifespan(0.5),
                        opacity(0.7)
                     ]);
                }
            }

            if (player.pos.y > height() + 100) {
                shake(20);
                wait(0.5, () => go("game"));
            }
        });

        player.onCollide("obstacle", () => {
            shake(10); 
            wait(0.5, () => go("game")); 
        });

        function jump() {
            if (player.isGrounded() && !isGameFinished) {
                player.jump(900);
                add([
                    circle(10),
                    pos(player.pos.x, player.pos.y),
                    color(255,255,255),
                    opacity(0.5),
                    scale(1),
                    lifespan(0.5),
                    anchor("center")
                ]);
            }
        }

        // --- HTML BUTON KONTROLLERİ ---
        const btnRight = document.getElementById("btn-right");
        const btnJump = document.getElementById("btn-jump");

        // İLERİ BUTONU
        const startRight = () => { isRightBtnPressed = true; };
        const endRight = () => { isRightBtnPressed = false; };

        btnRight.addEventListener("touchstart", (e) => { e.preventDefault(); startRight(); });
        btnRight.addEventListener("touchend", (e) => { e.preventDefault(); endRight(); });
        btnRight.addEventListener("mousedown", startRight); // PC testi için
        btnRight.addEventListener("mouseup", endRight);
        btnRight.addEventListener("mouseleave", endRight);

        // ZIPLA BUTONU
        const doJump = (e) => { 
            if(e) e.preventDefault(); 
            jump(); 
        };

        btnJump.addEventListener("touchstart", doJump);
        btnJump.addEventListener("mousedown", doJump); // PC testi için

        // Klavye Kontrolleri (Hala aktif)
        onKeyPress("space", jump);
        onKeyPress("left", jump);
        // Not: Sağa gitme (right) onUpdate içinde isKeyDown ile kontrol ediliyor.

        // --- FİNAL SENARYOSU ---
        player.onCollide("boyfriend", () => {
            isGameFinished = true;
            isRightBtnPressed = false; // Otomatik durdur
            
            // Butonları gizle
            document.getElementById("controls").style.display = "none";
            
            camPos(boyfriend.pos.x, height()/2);

            // Soru metni
            const questionText = add([
                text("Beni affeder misin?", { size: 28, width: 400, align: "center", font: "Arial" }),
                pos(boyfriend.pos.x, boyfriend.pos.y - 200),
                color(0, 0, 0),
                anchor("center")
            ]);

            // EVET Butonu
            const btnYes = add([
                rect(120, 50, { radius: 10 }),
                pos(boyfriend.pos.x - 70, boyfriend.pos.y - 120),
                color(50, 205, 50),
                area(),
                anchor("center"),
                "btnYes"
            ]);
            add([
                text("EVET", { size: 24, font: "Arial" }),
                pos(boyfriend.pos.x - 70, boyfriend.pos.y - 120),
                color(255, 255, 255),
                anchor("center")
            ]);

            // HAYIR Butonu
            const btnNo = add([
                rect(120, 50, { radius: 10 }),
                pos(boyfriend.pos.x + 70, boyfriend.pos.y - 120),
                color(220, 20, 60),
                area(),
                anchor("center"),
                "btnNo"
            ]);
            const txtNo = add([
                text("HAYIR", { size: 24, font: "Arial" }),
                pos(boyfriend.pos.x + 70, boyfriend.pos.y - 120),
                color(255, 255, 255),
                anchor("center")
            ]);

            // BUTON ETKİLEŞİMLERİ
            onClick("btnYes", () => {
                destroy(btnYes); destroy(btnNo); destroy(txtNo);
                destroy(questionText);
                
                // HTML içindeki fotoğrafı görünür yap
                document.getElementById('final-photo-container').style.display = 'block';

                // Kalp Yağmuru
                loop(0.1, () => {
                    add([
                        pos(boyfriend.pos.x, boyfriend.pos.y - 100),
                        move(rand(0, 360), rand(100, 300)),
                        lifespan(3),
                        opacity(1),
                        {
                            draw() {
                                const c = rgb(255, 0, 0);
                                drawRect({ width: 20, height: 20, color: c, angle: 45, anchor: "center" });
                                drawCircle({ pos: vec2(-7, -7), radius: 10, color: c });
                                drawCircle({ pos: vec2(7, -7), radius: 10, color: c });
                            }
                        }
                    ]);
                });

                // Final Yazısı
                add([
                    text("SENI SEVIYORUMM", { size: 32, width: 500, align: "center", font: "Arial" }),
                    pos(boyfriend.pos.x, boyfriend.pos.y - 280 + 100), // Biraz daha aşağıda
                    color(255, 0, 0), // Kırmızı
                    anchor("center")
                ]);
            });

            onClick("btnNo", () => {
                const randomX = rand(boyfriend.pos.x - 300, boyfriend.pos.x + 300);
                const randomY = rand(100, height() - 100);
                btnNo.pos = vec2(randomX, randomY);
                txtNo.pos = vec2(randomX, randomY);
                shake(5);
            });
        });
    });

    go("game");

</script>
</body>
</html>
